[backend]
precision = double

[constants]
nu = 0.005
Uin = 1.0
Vin = 0.0
Pc = 1.0
ac-zeta = 2.5

[solver]
system = ac-navier-stokes
order = 3

[solver-time-integrator]
formulation = dual
scheme = sdirk33
pseudo-scheme = rk45
controller = none
pseudo-controller = local-pi
tstart = 0.0
tend = 3076.0
dt = 0.125
pseudo-dt = 0.0125
pseudo-niters-min = 3
pseudo-niters-max = 3
pseudo-resid-norm = l2
pseudo-resid-tol = 1e-12
atol = 1e-6
pseudo-dt-max-mult = 2.5

[solver-dual-time-integrator-multip]
pseudo-dt-fact = 1.75
cycle = [(3, 1), (2, 1), (1, 1), (1, 1), (2, 1), (3, 4)]

[solver-interfaces]
riemann-solver = rusanov
ldg-beta = 0.5
ldg-tau = 0.1

[solver-interfaces-line]
flux-pts = gauss-legendre

[solver-elements-tri]
soln-pts = williams-shunn

[solver-elements-quad]
soln-pts = gauss-legendre-lobatto

[soln-plugin-nancheck]
nsteps = 50

[soln-plugin-pseudostats]
flushsteps = 20
file = residual.csv
header = true

[soln-plugin-writer]
dt-out = 5.0
basedir = .
basename = inc-cylinder-ptb-{t:.2f}

[soln-bcs-wall]
type = no-slp-wall

[soln-bcs-inlet]
type = ac-char-riem-inv
ac-zeta = 180
p = Pc
u = Uin
v = Vin

[soln-bcs-outlet]
type = ac-char-riem-inv
ac-zeta = 180
p = Pc
u = Uin
v = Vin

[solver-plugin-flowcontrol]
nsteps= 1
ploc= [(0, -0.5) ,(0, 0.5)]
file= randmat_re200_long_u5

[soln-plugin-sampler]
samp-pts = [(0.5, 0.0), (0.43301270189221935, 0.25), (0.25, 0.4330127018922193), (0.0, 0.5), (-0.25, 0.43301270189221935), (-0.43301270189221924, 0.25), (-0.5, 0.0), (-0.4330127018922194, -0.25), (-0.25, -0.43301270189221924), (0.0, -0.5), (0.25, -0.4330127018922195), (0.4330127018922192, -0.25)]
file= pointdata_re200_src_long_u5
header=true
nsteps=1

[soln-plugin-tavg]
nsteps = 1
dt-out = 5.0
mode=continuous
basedir = .
basename = inc-cylinder-src-tavg-{t:.2f}
avg-u = u
avg-v = v
avg-p = p
precision = double

[soln-ics]
u = Uin
v = Vin
p = Pc
